[build-system]
requires = ["setuptools>=65.0", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jardiscordengine"
version = "0.1.0"
description = "Wrapper over PyCord providing simple and easy-to-use API."
authors = [
    { name = "Nathan Jarjarbin", email = "nathan.amaraggi@epitech.eu" }
]
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"

dependencies = [
    "pip",
    "py-cord",
    "dotenv",
    "jarbin-toolkit-error",
    "jarbin-toolkit-time",
    "jarbin-toolkit-config",
    "jarbin-toolkit-log",
    "jarbin-toolkit-console",
]

classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control :: Git"
]

[project.urls]
Homepage = "https://jarjarbin-studio.github.io/JarDiscordEngine/"
Repository = "https://github.com/Jarjarbin-Studio/JarDiscordEngine/"
Issues = "https://github.com/Jarjarbin-Studio/JarDiscordEngine/issues/"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"

[tool.setuptools.packages.find]
where = ["."]
include = ["jardiscordengine*"]
exclude = [
    "perso*"
]
